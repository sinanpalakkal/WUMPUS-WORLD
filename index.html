<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wumpus World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: #f7fafc;
            touch-action: manipulation;
        }

        .game-title {
            font-family: 'Press Start 2P', cursive;
        }

        .grid-cell {
            transition: all 0.3s ease;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .fog {
            background-color: #2d3748;
            cursor: not-allowed;
        }

        .visited {
            background-color: #e2e8f0;
            color: #1a202c;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }

        .entity {
            font-size: 2rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .indicator {
            position: absolute;
            font-size: 1.2rem;
            z-index: 5;
            opacity: 0.8;
        }
        
        .breeze-indicator { bottom: 2px; left: 2px; }
        .stench-indicator { top: 2px; right: 2px; }

        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background-color: #4a5568;
            border-radius: 4px;
        }

        .btn-control {
            user-select: none;
            -webkit-user-select: none;
        }
        
        .btn-control:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <div class="max-w-5xl w-full flex flex-col items-center gap-6">
        <h1 class="game-title text-2xl md:text-4xl text-yellow-400 text-center drop-shadow-md">WUMPUS WORLD</h1>
        
        <div class="flex flex-col lg:flex-row gap-8 w-full justify-center items-start">
            
            <!-- Left Side: Game Board & Status -->
            <div class="flex flex-col items-center w-full lg:w-auto">
                
                <!-- Status Bar -->
                <div class="w-full max-w-[320px] flex justify-between bg-gray-800 p-3 rounded-t-lg border-b border-gray-700">
                    <span class="font-bold text-gray-300">Pos: <span id="pos-display" class="text-white">(1, 1)</span></span>
                    <span class="font-bold text-gray-300">Arrows: <span id="arrow-display" class="text-white">1 🏹</span></span>
                </div>

                <!-- 4x4 Grid -->
                <div id="game-board" class="grid grid-cols-4 grid-rows-4 gap-1 bg-gray-900 p-2 rounded-b-lg shadow-2xl w-full max-w-[320px] aspect-square">
                    <!-- Cells generated by JS -->
                </div>

                <!-- Controls -->
                <div class="mt-6 flex flex-col items-center bg-gray-800 p-4 rounded-xl shadow-lg w-full max-w-[320px]">
                    <div class="flex justify-between w-full mb-4 items-center">
                        <span class="font-bold text-gray-400 text-sm uppercase tracking-wider">Controls</span>
                        <button id="mode-toggle" onclick="toggleAimMode()" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition-colors shadow">
                            Mode: MOVE 🏃
                        </button>
                    </div>

                    <!-- D-Pad -->
                    <div class="grid grid-cols-3 grid-rows-3 gap-2 w-40">
                        <div></div>
                        <button onclick="handleAction('up')" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg p-3 flex justify-center items-center text-xl shadow">⬆️</button>
                        <div></div>
                        <button onclick="handleAction('left')" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg p-3 flex justify-center items-center text-xl shadow">⬅️</button>
                        <button onclick="handleAction('down')" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg p-3 flex justify-center items-center text-xl shadow">⬇️</button>
                        <button onclick="handleAction('right')" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg p-3 flex justify-center items-center text-xl shadow">➡️</button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Log & Instructions -->
            <div class="w-full lg:w-96 flex flex-col gap-4">
                <div class="bg-gray-800 rounded-xl shadow-lg p-4 h-64 lg:h-96 flex flex-col">
                    <h2 class="text-lg font-bold text-gray-400 mb-2 border-b border-gray-700 pb-2">Event Log</h2>
                    <div id="event-log" class="log-container flex-1 overflow-y-auto space-y-2 text-sm text-gray-300 pr-2">
                        <!-- Logs generated by JS -->
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl shadow-lg p-4">
                    <h2 class="text-lg font-bold text-gray-400 mb-2">Legend & Rules</h2>
                    <ul class="text-sm text-gray-300 space-y-1">
                        <li>🧑 <strong>You</strong> - Explore and survive.</li>
                        <li>💰 <strong>Gold</strong> - Grab this to win! (Causes Glitter ✨)</li>
                        <li>🕳️ <strong>Pit</strong> - Bottomless drop. (Causes Breeze 💨 nearby)</li>
                        <li>👹 <strong>Wumpus</strong> - Deadly beast. (Causes Stench 🤢 nearby)</li>
                    </ul>
                    <button onclick="initGame()" class="w-full mt-4 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded shadow transition-colors">
                        Restart Game
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal for Game Over -->
    <div id="game-over-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex justify-center items-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl max-w-sm text-center shadow-2xl border border-gray-700">
            <h2 id="modal-title" class="text-3xl font-bold mb-4">Game Over</h2>
            <p id="modal-desc" class="text-gray-300 mb-6">You died.</p>
            <button onclick="closeModal(); initGame();" class="px-6 py-2 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded shadow transition-colors">Play Again</button>
        </div>
    </div>

<script>
    // --- Game State ---
    let player = { x: 1, y: 1 };
    let wumpus = { x: 0, y: 0, alive: true };
    let gold = { x: 0, y: 0 };
    let pits = [];
    let visited = new Set();
    let arrows = 1;
    let gameOver = false;
    let aimMode = false; // false = Move, true = Shoot

    const BOARD_SIZE = 4;

    // --- Initialization ---
    function initGame() {
        player = { x: 1, y: 1 };
        arrows = 1;
        gameOver = false;
        aimMode = false;
        visited = new Set();
        visited.add("1,1");
        
        document.getElementById('event-log').innerHTML = '';
        updateModeUI();
        
        placeEntities();
        logEvent("You descend into the dark cave... Find the Gold! 💰", "text-yellow-400");
        
        evaluateCurrentCell();
        renderBoard();
        updateStatus();
    }

    function placeEntities() {
        pits = [];
        // Available coordinates excluding (1,1)
        let availableCoords = [];
        for (let x = 1; x <= BOARD_SIZE; x++) {
            for (let y = 1; y <= BOARD_SIZE; y++) {
                if (x === 1 && y === 1) continue;
                availableCoords.push({x, y});
            }
        }
        
        // Shuffle array to pick random spots
        availableCoords.sort(() => Math.random() - 0.5);

        // Place Wumpus (ensure not adjacent to 1,1 to avoid immediate unfair death feeling, though stench gives warning)
        // Safe spawn for Wumpus: Not (1,2) and not (2,1)
        let wumpusIndex = availableCoords.findIndex(pos => !(pos.x === 1 && pos.y === 2) && !(pos.x === 2 && pos.y === 1));
        wumpus = { ...availableCoords[wumpusIndex], alive: true };
        availableCoords.splice(wumpusIndex, 1);

        // Place Gold
        gold = { ...availableCoords.pop() };

        // Place Pits (2 or 3)
        let numPits = Math.random() < 0.5 ? 2 : 3;
        for (let i = 0; i < numPits; i++) {
            pits.push({ ...availableCoords.pop() });
        }
    }

    // --- Core Logic ---
    function getDistance(x1, y1, x2, y2) {
        return Math.abs(x1 - x2) + Math.abs(y1 - y2); // Manhattan distance
    }

    function isAdjacent(p1, p2) {
        return getDistance(p1.x, p1.y, p2.x, p2.y) === 1;
    }

    function evaluateCurrentCell() {
        if (gameOver) return;

        // Check loss conditions first
        if (wumpus.alive && player.x === wumpus.x && player.y === wumpus.y) {
            logEvent("CHOMP! You were eaten by the Wumpus! 👹🩸", "text-red-500 font-bold");
            endGame(false, "You became Wumpus food.");
            return;
        }

        let onPit = pits.find(p => p.x === player.x && p.y === player.y);
        if (onPit) {
            logEvent("Aaaah! You fell into a bottomless pit! 🕳️💀", "text-red-500 font-bold");
            endGame(false, "You fell to your doom.");
            return;
        }

        // Check win condition
        if (player.x === gold.x && player.y === gold.y) {
            logEvent("You found the Gold! ✨💰✨", "text-yellow-400 font-bold");
            endGame(true, "You secured the bag and survived!");
            return;
        }

        // Check perceptions
        let stench = wumpus.alive && isAdjacent(player, wumpus);
        let breeze = pits.some(p => isAdjacent(player, p));

        if (stench) logEvent("🤢 You smell a terrible stench...", "text-green-400");
        if (breeze) logEvent("💨 You feel a cold breeze...", "text-blue-300");
        
        if (!stench && !breeze && (player.x !== 1 || player.y !== 1)) {
            logEvent("It is quiet here.", "text-gray-400");
        }
    }

    function handleAction(dir) {
        if (gameOver) return;

        let dx = 0, dy = 0;
        if (dir === 'up') dy = 1;
        if (dir === 'down') dy = -1;
        if (dir === 'left') dx = -1;
        if (dir === 'right') dx = 1;

        if (aimMode) {
            shootArrow(dx, dy, dir);
            aimMode = false; // Auto switch back to move after shooting
            updateModeUI();
        } else {
            movePlayer(dx, dy);
        }
    }

    function movePlayer(dx, dy) {
        let newX = player.x + dx;
        let newY = player.y + dy;

        if (newX < 1 || newX > BOARD_SIZE || newY < 1 || newY > BOARD_SIZE) {
            logEvent("Ouch! You bumped into a wall.", "text-gray-500");
            return;
        }

        player.x = newX;
        player.y = newY;
        visited.add(`${player.x},${player.y}`);
        
        logEvent(`Moved to (${player.x}, ${player.y})`, "text-white");
        
        renderBoard();
        updateStatus();
        evaluateCurrentCell();
    }

    function shootArrow(dx, dy, dirName) {
        if (arrows <= 0) {
            logEvent("You are out of arrows! 🪫", "text-red-400");
            return;
        }

        arrows--;
        updateStatus();
        logEvent(`🏹 Shot arrow ${dirName.toUpperCase()}!`, "text-orange-400");

        if (!wumpus.alive) {
            logEvent("The Wumpus is already dead.", "text-gray-500");
            return;
        }

        // Check if wumpus is in the line of fire
        let hit = false;
        let cx = player.x;
        let cy = player.y;

        while(cx >= 1 && cx <= BOARD_SIZE && cy >= 1 && cy <= BOARD_SIZE) {
            cx += dx;
            cy += dy;
            if (cx === wumpus.x && cy === wumpus.y) {
                hit = true;
                break;
            }
        }

        if (hit) {
            wumpus.alive = false;
            logEvent("RAAAARGH! You hear a terrifying scream! The Wumpus is dead! 🦇🔪", "text-green-400 font-bold");
            renderBoard(); // Update stenches
        } else {
            logEvent("*clatter* You hear your arrow hit a wall. You missed.", "text-gray-400");
        }
    }

    // --- UI/Rendering ---
    function toggleAimMode() {
        if (gameOver) return;
        aimMode = !aimMode;
        updateModeUI();
    }

    function updateModeUI() {
        const btn = document.getElementById('mode-toggle');
        if (aimMode) {
            btn.innerHTML = "Mode: SHOOT 🏹";
            btn.classList.replace('bg-blue-600', 'bg-red-600');
            btn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
        } else {
            btn.innerHTML = "Mode: MOVE 🏃";
            btn.classList.replace('bg-red-600', 'bg-blue-600');
            btn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
        }
    }

    function renderBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';

        // Iterate backwards for Y to make (1,1) bottom-left
        for (let y = BOARD_SIZE; y >= 1; y--) {
            for (let x = 1; x <= BOARD_SIZE; x++) {
                
                const cell = document.createElement('div');
                cell.className = "grid-cell rounded border border-gray-700 flex justify-center items-center relative overflow-hidden";
                
                const isVisited = visited.has(`${x},${y}`);
                
                if (isVisited || gameOver) {
                    cell.classList.add('visited');
                    
                    // Add Entities
                    if (x === player.x && y === player.y) {
                        cell.innerHTML += `<span class="entity">🧑</span>`;
                    } else if (wumpus.alive && x === wumpus.x && y === wumpus.y && (isVisited || gameOver)) {
                        cell.innerHTML += `<span class="entity">👹</span>`;
                    } else if (!wumpus.alive && x === wumpus.x && y === wumpus.y && (isVisited || gameOver)) {
                        cell.innerHTML += `<span class="entity opacity-50">💀</span>`;
                    } else if (x === gold.x && y === gold.y && (isVisited || gameOver)) {
                        cell.innerHTML += `<span class="entity">💰</span>`;
                    } else if (pits.some(p => p.x === x && p.y === y) && (isVisited || gameOver)) {
                        cell.innerHTML += `<span class="entity">🕳️</span>`;
                    }

                    // Add Indicators for visited cells (Perceptions)
                    // We only show perceptions if it's safe and visited (unless game over reveals all)
                    if (isVisited) {
                        let cellStench = wumpus.alive && isAdjacent({x, y}, wumpus);
                        let cellBreeze = pits.some(p => isAdjacent({x, y}, p));
                        
                        if (cellStench) {
                            cell.innerHTML += `<span class="indicator stench-indicator" title="Stench">🤢</span>`;
                        }
                        if (cellBreeze) {
                            cell.innerHTML += `<span class="indicator breeze-indicator" title="Breeze">💨</span>`;
                        }
                    }

                } else {
                    cell.classList.add('fog');
                }

                board.appendChild(cell);
            }
        }
    }

    function logEvent(msg, colorClass = "text-gray-300") {
        const logContainer = document.getElementById('event-log');
        const entry = document.createElement('div');
        entry.className = `border-b border-gray-700 pb-1 ${colorClass}`;
        entry.innerText = `> ${msg}`;
        logContainer.appendChild(entry);
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    function updateStatus() {
        document.getElementById('pos-display').innerText = `(${player.x}, ${player.y})`;
        document.getElementById('arrow-display').innerText = `${arrows} 🏹`;
    }

    function endGame(win, message) {
        gameOver = true;
        renderBoard(); // Reveal board
        
        setTimeout(() => {
            const modal = document.getElementById('game-over-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            
            modal.classList.remove('hidden');
            if (win) {
                title.innerText = "Victory!";
                title.className = "text-3xl font-bold mb-4 text-yellow-400";
            } else {
                title.innerText = "Game Over";
                title.className = "text-3xl font-bold mb-4 text-red-500";
            }
            desc.innerText = message;
        }, 500);
    }

    function closeModal() {
        document.getElementById('game-over-modal').classList.add('hidden');
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
        if (gameOver) return;
        
        switch(e.key) {
            case 'ArrowUp':
            case 'w':
                handleAction('up'); break;
            case 'ArrowDown':
            case 's':
                handleAction('down'); break;
            case 'ArrowLeft':
            case 'a':
                handleAction('left'); break;
            case 'ArrowRight':
            case 'd':
                handleAction('right'); break;
            case 'Shift':
                toggleAimMode(); break;
        }
    });

    // Start
    initGame();

</script>
</body>
</html>
